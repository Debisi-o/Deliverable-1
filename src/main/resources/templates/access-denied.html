<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied | Course Compass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container text-center py-5">
        <p class="display-1 fw-bold text-primary">403</p>
        <h1 class="display-6 fw-bold mb-3">You do not have permission to view that page.</h1>
        <p class="text-secondary mx-auto section-copy">This area is reserved for a different account type. Sign in with the right role or return to the public catalogue.</p>
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
            <a class="btn btn-primary" th:href="@{/courses}">Browse courses</a>
            <a class="btn btn-outline-primary" th:href="@{/login}">Sign in</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

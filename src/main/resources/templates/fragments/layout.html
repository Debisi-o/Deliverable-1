<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm"
     aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span aria-hidden="true">◉</span> Course Compass
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/courses}">Browse courses</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'INSTRUCTOR')">
                    <a class="btn btn-light text-primary fw-semibold ms-lg-2" th:href="@{/courses/new}">Add a course</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <span sec:authentication="name">Account</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end account-menu shadow-sm border-0">
                        <div class="dropdown-item-text small text-secondary">
                            Signed in as <strong sec:authentication="name">user@example.com</strong>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item-text pt-1" sec:authorize="hasAnyRole('ADMIN', 'INSTRUCTOR')">
                            <a class="btn btn-sm btn-outline-primary w-100" th:href="@{/courses/new}">Publish a course</a>
                        </div>
                        <div class="dropdown-item-text" sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-sm btn-outline-dark w-100" th:href="@{/admin}">Open admin workspace</a>
                        </div>
                        <div class="dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post" class="px-3 pb-2">
                            <button class="btn btn-sm btn-danger-subtle w-100 logout-btn" type="submit">Logout</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-white-50 py-4 mt-auto">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>&copy; 2026 Course Compass</span>
        <span>Practical learning, clearly mapped.</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.title + ' | Course Compass'}">Course | Course Compass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="flex-grow-1 py-5">
    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Course saved.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <a class="text-decoration-none" th:href="@{/courses}">← Back to courses</a>
        <article class="row g-5 mt-1">
            <div class="col-lg-8">
                <div class="d-flex gap-2 mb-3">
                    <span class="badge text-bg-primary" th:text="${course.category.displayName}">Category</span>
                    <span class="badge text-bg-light border" th:text="${course.difficulty.displayName}">Level</span>
                </div>
                <h1 class="display-5 fw-bold" th:text="${course.title}">Course title</h1>
                <p class="lead text-secondary">Taught by <strong class="text-dark" th:text="${course.instructor}">Instructor</strong></p>
                <hr class="my-4">
                <h2 class="h4">About this course</h2>
                <p class="course-description" th:text="${course.description}">Description</p>
            </div>
            <aside class="col-lg-4">
                <div class="card border-0 shadow-sm sticky-lg-top details-card">
                    <div class="card-body p-4">
                        <p class="text-secondary small text-uppercase fw-semibold mb-1">Course fee</p>
                        <p class="display-6 fw-bold text-primary"
                           th:text="${course.price.signum() == 0 ? 'Free' : '₦' + #numbers.formatDecimal(course.price, 1, 'COMMA', 2, 'POINT')}">₦25,000</p>
                        <dl class="row mb-0 border-top pt-3">
                            <dt class="col-6">Duration</dt>
                            <dd class="col-6 text-end" th:text="${course.durationHours + ' hours'}">20 hours</dd>
                            <dt class="col-6">Difficulty</dt>
                            <dd class="col-6 text-end" th:text="${course.difficulty.displayName}">Beginner</dd>
                            <dt class="col-6">Added</dt>
                            <dd class="col-6 text-end" th:text="${#temporals.format(course.createdAt, 'd MMM yyyy')}">1 Jan 2026</dd>
                            <dt class="col-6">Record ID</dt>
                            <dd class="col-6 text-end" th:text="${'#' + course.id}">#1</dd>
                        </dl>
                    </div>
                </div>
            </aside>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | Course Compass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container text-center py-5">
    <p class="display-1 fw-bold text-primary" th:text="${status}">404</p>
    <h1 class="h2">We could not find that page.</h1>
    <p class="text-secondary" th:text="${message}">The requested page is unavailable.</p>
    <a class="btn btn-primary" th:href="@{/}">Return home</a>
</main>
</body>
</html>
